name: Build release bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.9

jobs:
  linux:
    name: Linux desktop bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libfuse2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DX_VERSION}" --locked

      - name: Build Linux AppImage
        run: dx bundle --package desktop --platform linux --package-types appimage --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: hisho-linux
          path: |
            target/dx/desktop/**/*.AppImage
            target/dx/desktop/**/*.appimage
          if-no-files-found: error

  android:
    name: Android bundles
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DX_VERSION}" --locked

      - name: Build Android APK
        run: dx bundle --package mobile --platform android --package-types apk --release

      - name: Build Android App Bundle
        run: dx bundle --package mobile --platform android --package-types aab --release

      - name: Upload Android bundles
        uses: actions/upload-artifact@v4
        with:
          name: hisho-android
          path: |
            target/dx/mobile/**/*.apk
            target/dx/mobile/**/*.aab
          if-no-files-found: error

  windows:
    name: Windows desktop bundle
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        shell: pwsh
        run: cargo install dioxus-cli --version $env:DX_VERSION --locked

      - name: Build Windows MSI
        shell: pwsh
        run: dx bundle --package desktop --platform windows --package-types msi --release

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: hisho-windows
          path: |
            target/dx/desktop/**/*.msi
            target/dx/desktop/**/*.exe
          if-no-files-found: error

  apple:
    name: Apple bundles
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DX_VERSION}" --locked

      - name: Build macOS DMG
        run: dx bundle --package desktop --platform macos --package-types dmg --release

      - name: Build unsigned iOS app
        run: dx bundle --package mobile --platform ios --package-types ios --codesign false --release

      - name: Package unsigned iOS app
        shell: bash
        run: |
          app_path=$(find target/dx/mobile -type d -name '*.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "No iOS .app bundle was produced"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" target/dx/mobile/hisho-ios-unsigned.zip

      - name: Upload Apple bundles
        uses: actions/upload-artifact@v4
        with:
          name: hisho-apple
          path: |
            target/dx/desktop/**/*.dmg
            target/dx/mobile/hisho-ios-unsigned.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android, windows, apple]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          pattern: hisho-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded assets
        run: find release-assets -type f -exec ls -lh {} \;

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating it..."
            gh release create "$TAG" --title "Hisho $TAG" --generate-notes
            sleep 2
          else
            echo "Release $TAG already exists."
          fi

      - name: Upload all bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          
          # Find all files recursively and upload them
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              echo "Uploading: $file"
              gh release upload "$TAG" "$file" --clobber
            fi
          done < <(find . -type f)
          
          echo "All bundles uploaded successfully"